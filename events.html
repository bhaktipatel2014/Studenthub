<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Events</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/theme.css">

</head>

<body>
    <header class="site-header">
  <a class="logo" href="index.html" aria-label="StudentHub home">
    <img src="images/logo-mark.png" alt="">
    <span>StudentHub</span>
  </a>
  <nav id="navMenu" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    <details class="nav-group">
      <summary>Academics</summary>
      <div class="nav-dropdown">
      <a href="profile.html">Profile</a>
      <a href="attendance.html">Attendance</a>
      <a href="timetable.html">Timetable</a>
      <a href="assignment.html">Assignments</a>
      </div>
    </details>
    <details class="nav-group is-active">
      <summary>Campus</summary>
      <div class="nav-dropdown">
      <a href="Notice.html">Notices</a>
      <a href="events.html" class="active" aria-current="page">Events</a>
      </div>
    </details>
    <details class="nav-group">
      <summary>Support</summary>
      <div class="nav-dropdown">
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
      <a href="feedback.html">Feedback</a>
      </div>
    </details>
    <a href="login.html" class="login">Sign in</a>
    <a href="register.html" class="register">Create account</a>
  </nav>
</header>

<main>
        <section class="container">
            <div class="section-title">
                <h1>College Events</h1>
                <a href="index.html">← Home</a>
            </div>

            <label for="eventSearch">Search Events</label>
            <input type="search" id="eventSearch" placeholder="Search by event name">

            <label for="eventFilter">Filter by Category</label>
            <select id="eventFilter">
                <option value="all">All Categories</option>
                <option value="Technical">Technical</option>
                <option value="Academic">Academic</option>
                <option value="Campus">Campus</option>
            </select>

            <label for="eventSort">Sort Events</label>
            <select id="eventSort">
                <option value="date-asc">Date: soonest first</option>
                <option value="date-desc">Date: latest first</option>
                <option value="title-asc">Name: A to Z</option>
                <option value="title-desc">Name: Z to A</option>
            </select>

            <p id="eventStatus" aria-live="polite">Loading events...</p>
            <div class="cards" id="eventList"></div>

            <div>
                <button type="button" id="previousPage">Previous</button>
                <span id="pageNumber">Page 1</span>
                <button type="button" id="nextPage">Next</button>
            </div>
        </section>
    </main>

    <footer>
        <h3>StudentHub</h3>
        <p>Your Digital Campus Portal</p>
        <p>&copy; 2026 StudentHub. All Rights Reserved.</p>
    </footer>

    <script src="js/events.js"></script>
  <script src="js/theme.js"></script>
</body>

</html>
