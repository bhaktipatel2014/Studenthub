<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Register</title>
</head>

<body>
    <header>
        <h1>Student Registration</h1>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

    <main>
        <form action="php/register.php" method="post" id="registrationForm" novalidate>
            <label for="fullName">Full Name:</label><br>
            <input type="text" id="fullName" name="full_name" required pattern="[A-Za-z ]{2,50}"
                aria-describedby="nameError">
            <p id="nameError" class="error" aria-live="polite"></p>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required aria-describedby="emailError">
            <p id="emailError" class="error" aria-live="polite"></p>

            <label for="mobile">Mobile:</label><br>
            <input type="tel" id="mobile" name="mobile" required pattern="[0-9]{10}" aria-describedby="mobileError">
            <p id="mobileError" class="error" aria-live="polite"></p>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8"
                aria-describedby="passwordError passwordStrength">
            <p id="passwordStrength" aria-live="polite"></p>
            <p id="passwordError" class="error" aria-live="polite"></p>

            <label for="confirmPassword">Confirm Password:</label><br>
            <input type="password" id="confirmPassword" name="confirm_password" required
                aria-describedby="confirmError">
            <p id="confirmError" class="error" aria-live="polite"></p>

            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="B.Tech IT">B.Tech IT</option>
                <option value="B.Tech CSE">B.Tech CSE</option>
            </select><br><br>

            <label for="year">Year:</label><br>
            <select id="year" name="year" required>
                <option value="">Select Year</option>
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select><br><br>

            <fieldset>
                <legend>Gender</legend>
                <label><input type="radio" name="gender" value="Female" required> Female</label>
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </fieldset><br>

            <label>
                <input type="checkbox" id="terms" name="terms" value="yes" required>
                I accept the terms and conditions.
            </label>
            <p id="termsError" class="error" aria-live="polite"></p>

            <button type="submit">Register</button>
        </form>
    </main>

    <footer>
        <p>StudentHub Portal</p>
        <p>&copy; 2026 StudentHub. All Rights Reserved.</p>
    </footer>

    <script src="JS/register.js"></script>
</body>

</html>
